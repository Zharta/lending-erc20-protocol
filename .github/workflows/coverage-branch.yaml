name: Branch coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  BOA_FORK_RPC_URL: "https://eth-mainnet.g.alchemy.com/${{ secrets.ALCHEMY_KEY }}"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run unit tests with branch coverage
      run: |
        coverage run --branch -m pytest tests/p2p_erc20_v1/unit tests/p2p_erc20_securitize/unit tests/p2p_erc20_vaulted/unit tests/registrar_connector/unit --durations=0 --runslow
        coverage report -m | tee coverage-branch.txt
        sed -i '1s/^/coverage: platform marker \n/' coverage-branch.txt
        coverage xml

    - name: Create branch coverage comment
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-coverage-path: ./coverage-branch.txt
        title: "Branch Coverage Report"
        badge-title: "Branch Coverage"
        unique-id-for-comment: branch-coverage
      if: github.event_name == 'pull_request'
